name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Quick gate: formatting check.
  # ───────────────────────────────────────────────────────────────────────

  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check formatting
        run: zig fmt --check src/ bench/ examples/

  # ───────────────────────────────────────────────────────────────────────
  # Native test matrix.
  #
  # v1.0 ships kqueue (Darwin/BSD) and epoll (Linux) as default reactor
  # backends. Windows is cross-compile validated only — see the
  # `cross-compile` job below and `src/io/reactor.zig` for the status note.
  # ───────────────────────────────────────────────────────────────────────

  test:
    name: Test (${{ matrix.name }})
    needs: format
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64-epoll
          - os: ubuntu-22.04-arm
            name: linux-arm64-epoll
          - os: ubuntu-latest
            name: linux-x86_64-iouring
            build_args: -Dreactor=iouring
            # io_uring backend's cancel-CQE handling isn't fully sound
            # yet (cancelled SQEs still produce CQEs that the poll loop
            # delivers; see reactor_iouring.zig comment on
            # unregisterWait). Tests that exercise cancel-during-I/O
            # may flake on this matrix entry until that's hardened.
            # Marked allowed-to-fail so it doesn't gate the build but
            # keeps the backend exercised so signature drift is caught.
            allow_failure: true
          - os: ubuntu-22.04-arm
            name: linux-arm64-iouring
            build_args: -Dreactor=iouring
            allow_failure: true
          - os: macos-latest
            name: macos-arm64-kqueue
          - os: macos-15-intel
            name: macos-x86_64-kqueue
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System info
        shell: bash
        run: |
          uname -a
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Kernel: $(uname -r)"
            grep -E '(io_uring|epoll)' /proc/kallsyms 2>/dev/null | head -3 || true
          fi
      - name: Unit + integration tests
        run: zig build test ${{ matrix.build_args }}
      - name: Build benchmarks (ReleaseFast smoke)
        run: zig build bench ${{ matrix.build_args }} --summary all -- --help || true

  # ───────────────────────────────────────────────────────────────────────
  # Cross-compile gate. The IOCP reactor (`src/io/reactor_iocp.zig`)
  # cross-compiles cleanly for x86_64 / aarch64 Windows; the io_uring
  # reactor (`src/io/reactor_iouring.zig`) cross-compiles cleanly for
  # Linux. Both are exercised here so API drift is caught even though
  # they aren't the default backends.
  # ───────────────────────────────────────────────────────────────────────

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cross-compile build-lib
        run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  # ───────────────────────────────────────────────────────────────────────
  # CI pass/fail summary.
  # ───────────────────────────────────────────────────────────────────────

  ci-success:
    name: CI Success
    needs: [test, cross-compile]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          # `test` aggregates the matrix incl. allow_failure entries —
          # if any non-allowed entry failed, the matrix is .failure(),
          # which we treat as overall fail. allow_failure entries
          # (currently io_uring) flag their failure on the run page
          # without breaking the gate.
          if [[ "${{ needs.test.result }}" != "success" ]] || [[ "${{ needs.cross-compile.result }}" != "success" ]]; then
            echo "CI failed: test=${{ needs.test.result }} cross-compile=${{ needs.cross-compile.result }}"
            exit 1
          fi
          echo "All CI checks passed."
