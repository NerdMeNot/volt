# TEMPORARY — fires the same checks as ci.yml on pushes to the
# scheduler-rewrite branch, so we get CI signal before merging to main.
# Delete this file once scheduler-rewrite is merged.

name: Temp CI (scheduler-rewrite)

on:
  push:
    branches: [scheduler-rewrite]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check src/ bench/ examples/

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  test:
    name: Test (${{ matrix.name }})
    needs: format
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x86_64-epoll,   build_args: "" }
          - { os: ubuntu-latest,    name: linux-x86_64-iouring, build_args: "-Dreactor=iouring" }
          - { os: ubuntu-22.04-arm, name: linux-arm64-epoll,    build_args: "" }
          - { os: ubuntu-22.04-arm, name: linux-arm64-iouring,  build_args: "-Dreactor=iouring" }
          - { os: macos-latest,     name: macos-arm64-kqueue,   build_args: "" }
          # macos-x86_64 dropped — see ci.yml for rationale.
          # Windows native test entry: blocked on three Zig 0.16 stdlib
          # bugs (std.Io.Writer fmt-spec, std.c ws2_32.addrinfo missing,
          # std.c mmap signature uses void). Cross-compile (build-lib) is
          # green for both x86_64 and aarch64 Windows; runtime support
          # lands in v1.x once upstream fixes land. Re-enable here when
          # they do.
          # - { os: windows-latest, name: windows-x86_64-iocp,  build_args: "", allow_failure: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - shell: bash
        run: |
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            uname -a
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              echo "Kernel: $(uname -r)"
            fi
          fi
      - run: zig build test ${{ matrix.build_args }}

  bench-gate:
    name: Bench gate (${{ matrix.name }})
    needs: format
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # See ci.yml for the linux-x86_64 allow_failure rationale.
          - { os: ubuntu-latest, name: linux-x86_64-epoll, allow_failure: true }
          - { os: macos-latest,  name: macos-arm64-kqueue }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: scripts/bench_gate.sh

  stress:
    name: Stress N=50 (${{ matrix.name }})
    needs: format
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64-epoll,   build_args: "" }
          - { os: ubuntu-latest, name: linux-x86_64-iouring, build_args: "-Dreactor=iouring" }
          - { os: macos-latest,  name: macos-arm64-kqueue,   build_args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - shell: bash
        run: N=50 TIMEOUT_SECS=120 scripts/stress_test.sh ${{ matrix.build_args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs-${{ matrix.name }}
          path: tmp/stress/
          if-no-files-found: ignore
          retention-days: 14
