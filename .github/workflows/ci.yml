name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

# ─────────────────────────────────────────────────────────────────────
# CI structure (Darwin arm64 only for runtime)
#
# Volt currently runs only on Darwin arm64 (kqueue reactor, AAPCS64
# context switch). Other targets are cross-compile-only — they parse
# and type-check but don't link, since kqueue symbols aren't available.
# Linux (epoll/io_uring) and Windows (IOCP) backends are planned but
# not yet implemented.
#
# Jobs:
# 1. format        — zig fmt --check on src/ + bench/ + build.zig
# 2. cross-compile — every target parses + type-checks (catches
#                    accidental Darwin-isms in portable code)
# 3. test          — full unit test suite, native, Darwin arm64
# 4. bench-smoke   — one bench builds + runs, Darwin arm64. Cheap
#                    early signal that the runtime survives a
#                    real workload — not a perf gate.
# 5. ci-success    — single boolean gate
# ─────────────────────────────────────────────────────────────────────

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check src/ bench/ build.zig

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - aarch64-windows-gnu
          - x86_64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  test:
    name: Test (macos-arm64-kqueue)
    needs: format
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test

  bench-smoke:
    name: Bench smoke (macos-arm64-kqueue)
    needs: format
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build bench-yield bench-spsc bench-rss -Doptimize=ReleaseFast

  ci-success:
    name: CI Success
    needs: [format, cross-compile, test, bench-smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          fail=0
          for r in format cross-compile test bench-smoke; do
            case "$r" in
              format)        got="${{ needs.format.result }}" ;;
              cross-compile) got="${{ needs.cross-compile.result }}" ;;
              test)          got="${{ needs.test.result }}" ;;
              bench-smoke)   got="${{ needs.bench-smoke.result }}" ;;
            esac
            if [[ "$got" != "success" ]]; then
              echo "::error::$r → $got"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All CI checks passed."
