name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

# ─────────────────────────────────────────────────────────────────────
# CI structure
#
# Volt runs natively on Darwin arm64 (kqueue reactor) and Linux arm64
# (epoll / io_uring reactor, with the L5a-L5c runtime portability
# work). Both are exercised by the `test` matrix job below — first
# real cross-platform validation as of L5.
#
# Windows arm64 is deliberately cross-compile-only. Native Windows
# ARM64 testing is blocked by an upstream Zig 0.16 bug: `zig build`
# segfaults on the `windows-11-arm` runner image (`zig version` and
# `zig fmt` both work fine). This is a Tier 2 platform per Zig's own
# release notes (https://ziglang.org/download/0.16.0/release-notes.html)
# and Zig's own CI doesn't currently run on Windows ARM64 either —
# see ziglang/zig#13862 and ziglang/zig#16665. Revisit when Zig
# upstream's `aarch64-windows` CI machine comes back online.
#
# x86_64 is also cross-compile-only across the board: Volt's context
# switch is ARM64-only today; x86_64 support is tracked by #149.
#
# Jobs:
# 1. format        — `zig fmt --check` on src/ + bench/ + build.zig
# 2. cross-compile — every target's lib parses + type-checks
#                    (catches accidental platform-isms in portable
#                    code). Lazy semantic analysis — see L5b probe
#                    notes for why this masked the `__error` symbol
#                    bug until exe-builds surfaced it.
# 3. test          — full unit test suite, native, matrix of
#                    {macos arm64, linux arm64}
# 4. bench-smoke   — one bench builds + runs, native macOS arm64.
#                    Cheap early signal that the runtime survives a
#                    real workload — not a perf gate.
# 5. ci-success    — single boolean gate
# ─────────────────────────────────────────────────────────────────────

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check src/ bench/ build.zig

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - aarch64-windows-gnu
          - x86_64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  test:
    name: Test (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest       # arm64 since macos-14
          - ubuntu-24.04-arm   # GitHub-hosted ARM64 Linux (free since 2024)
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test

  bench-smoke:
    name: Bench smoke (macos-arm64-kqueue)
    needs: format
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build bench-yield bench-spsc bench-rss -Doptimize=ReleaseFast

  ci-success:
    name: CI Success
    needs: [format, cross-compile, test, bench-smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          fail=0
          for r in format cross-compile test bench-smoke; do
            case "$r" in
              format)        got="${{ needs.format.result }}" ;;
              cross-compile) got="${{ needs.cross-compile.result }}" ;;
              test)          got="${{ needs.test.result }}" ;;
              bench-smoke)   got="${{ needs.bench-smoke.result }}" ;;
            esac
            if [[ "$got" != "success" ]]; then
              echo "::error::$r → $got"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All CI checks passed."
