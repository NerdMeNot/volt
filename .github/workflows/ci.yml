name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

# ─────────────────────────────────────────────────────────────────────
# CI structure
#
# After L6, Volt runs natively on FOUR (arch, OS) combinations:
#   * macOS arm64   (kqueue + Apple AAPCS64)         → macos-latest
#   * macOS x86_64  (kqueue + SysV x86-64, Rosetta)  → macos-latest
#                    (cross-compile, run via Rosetta)
#   * Linux arm64   (epoll/io_uring + AAPCS64)       → ubuntu-24.04-arm
#   * Linux x86_64  (epoll/io_uring + SysV x86-64)   → ubuntu-latest
#   * Windows x86_64 (IOCP + Microsoft x64 ABI)      → windows-latest
#
# Windows arm64 is the only cross-compile-only platform. Native
# Windows ARM64 testing is blocked by an upstream Zig 0.16 bug:
# `zig build` segfaults on the `windows-11-arm` runner image
# (`zig version` and `zig fmt` both work fine). This is a Tier 2
# platform per Zig's release notes (https://ziglang.org/download/
# 0.16.0/release-notes.html) and Zig's own CI doesn't currently
# run on Windows ARM64 either — see ziglang/zig#13862 and
# ziglang/zig#16665. Revisit when Zig upstream's `aarch64-windows`
# CI machine comes back online.
#
# Jobs:
# 1. format        — `zig fmt --check` on src/ + bench/ + build.zig
# 2. cross-compile — every target's lib parses + type-checks
#                    (catches accidental platform-isms in portable
#                    code).
# 3. test          — full unit test suite, native, matrix of
#                    {macos arm64, linux arm64, linux x86_64, windows x86_64}
# 4. bench-smoke   — one bench builds + runs, native macOS arm64.
#                    Cheap early signal that the runtime survives a
#                    real workload — not a perf gate.
# 5. ci-success    — single boolean gate
# ─────────────────────────────────────────────────────────────────────

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check src/ bench/ build.zig

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - aarch64-windows-gnu
          - x86_64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  test:
    name: Test (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    # Bumped from 15 to 30 to disambiguate "slow" from "hung" on
    # the L7 investigation. CI runners (2-4 vCPU) are 3-5x slower
    # than dev hardware (14+ core M-series); the bisected probe
    # rounds got individual filter steps through in <180s, so the
    # full suite SHOULD fit in 30 min if it isn't actually hung.
    timeout-minutes: 30
    # Force bash on every runner — Windows defaults to PowerShell,
    # whose native-exit-code propagation chewed up `zig build`'s
    # output during the L5 cross-platform probe. Git Bash is
    # preinstalled on Windows runners.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest       # arm64 since macos-14
          - ubuntu-24.04-arm   # GitHub-hosted ARM64 Linux (free since 2024)
          - ubuntu-latest      # x86_64 Linux — exercises SysV x86-64 ctx switch
          - windows-latest     # x86_64 Windows — exercises Microsoft x64 ABI
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Use `zig test` directly instead of `zig build test`. The
      # build-runner protocol (`--listen=-`) buffers test output
      # so a hung test produces zero visible progress in CI logs —
      # impossible to tell "hung" from "still running" from
      # observable behaviour. Direct invocation streams per-test
      # progress to stderr in real time.
      - run: zig test src/lib.zig -lc

  bench-smoke:
    name: Bench smoke (macos-arm64-kqueue)
    needs: format
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build bench-yield bench-spsc bench-rss -Doptimize=ReleaseFast

  ci-success:
    name: CI Success
    needs: [format, cross-compile, test, bench-smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          fail=0
          for r in format cross-compile test bench-smoke; do
            case "$r" in
              format)        got="${{ needs.format.result }}" ;;
              cross-compile) got="${{ needs.cross-compile.result }}" ;;
              test)          got="${{ needs.test.result }}" ;;
              bench-smoke)   got="${{ needs.bench-smoke.result }}" ;;
            esac
            if [[ "$got" != "success" ]]; then
              echo "::error::$r → $got"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All CI checks passed."
