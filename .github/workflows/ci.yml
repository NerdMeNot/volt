name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.15.2"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Quick Check - Formatting (fails fast)
  # ═══════════════════════════════════════════════════════════════════════════

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src/ tests/ bench/

  # ═══════════════════════════════════════════════════════════════════════════
  # Full Test Suite - All stages in one job per platform
  # ═══════════════════════════════════════════════════════════════════════════

  test:
    name: Test (${{ matrix.name }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-22.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: System info
        shell: bash
        run: |
          echo "Platform: ${{ matrix.name }}"
          echo "Runner: ${{ matrix.os }}"
          uname -a || ver

      # ── Unit Tests ──────────────────────────────────────────────────────
      - name: Unit tests
        run: zig build test

      # ── Extended Tests (concurrency, stress, robustness) ────────────────
      - name: Concurrency tests
        run: zig build test-concurrency

      - name: Stress tests
        run: zig build test-stress

      - name: Robustness tests
        run: zig build test-robustness

      # ── Benchmarks (build-only, skip Windows — needs Rust for Tokio) ───
      # Benchmarks are hardcoded to ReleaseFast in build.zig, so this also
      # verifies that release compilation succeeds.
      - name: Build benchmarks
        if: runner.os != 'Windows'
        run: zig build bench

  # ═══════════════════════════════════════════════════════════════════════════
  # CI Success Gate
  # ═══════════════════════════════════════════════════════════════════════════

  ci-success:
    name: CI Success
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "Test results: ${{ needs.test.result }}"

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi

          echo "All CI checks passed!"
