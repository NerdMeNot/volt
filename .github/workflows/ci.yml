name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Quick gate: formatting check.
  # ───────────────────────────────────────────────────────────────────────

  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check formatting
        run: zig fmt --check src/ bench/ examples/

  # ───────────────────────────────────────────────────────────────────────
  # Native test matrix.
  #
  # v1.0 ships kqueue (Darwin/BSD) and epoll (Linux) as default reactor
  # backends. Windows is cross-compile validated only — see the
  # `cross-compile` job below and `src/io/reactor.zig` for the status note.
  # ───────────────────────────────────────────────────────────────────────

  test:
    name: Test (${{ matrix.name }})
    needs: format
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-22.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System info
        shell: bash
        run: uname -a
      - name: Unit + integration tests
        run: zig build test
      - name: Build benchmarks (ReleaseFast smoke)
        run: zig build bench --summary all -- --help || true

  # ───────────────────────────────────────────────────────────────────────
  # Cross-compile gate. The IOCP reactor (`src/io/reactor_iocp.zig`)
  # cross-compiles cleanly for x86_64 / aarch64 Windows; the io_uring
  # reactor (`src/io/reactor_iouring.zig`) cross-compiles cleanly for
  # Linux. Both are exercised here so API drift is caught even though
  # they aren't the default backends.
  # ───────────────────────────────────────────────────────────────────────

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cross-compile build-lib
        run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  # ───────────────────────────────────────────────────────────────────────
  # CI pass/fail summary.
  # ───────────────────────────────────────────────────────────────────────

  ci-success:
    name: CI Success
    needs: [test, cross-compile]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]] || [[ "${{ needs.cross-compile.result }}" != "success" ]]; then
            echo "CI failed: test=${{ needs.test.result }} cross-compile=${{ needs.cross-compile.result }}"
            exit 1
          fi
          echo "All CI checks passed."
