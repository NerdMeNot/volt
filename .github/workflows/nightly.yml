name: Nightly

# Deep stress + memory checks. Runs once a day on a fresh checkout of
# `main`, plus on manual dispatch with a tunable iteration count.
#
# Iteration count rationale: N=200 catches a 1% flake with ~87%
# probability per nightly. Over a week of nightlies, that's >99.9%
# catch rate. Higher counts hit diminishing returns for the same wall
# time on GH-hosted runners (~30–45s/iter on 2-core Linux). For
# sub-0.1% flakes, manual dispatch with `n_iters=2000` is the path.

on:
  schedule:
    # 03:00 UTC daily. Off-hours for both US and EU contributors.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      n_iters:
        description: 'Stress iterations per (os, backend) entry'
        required: false
        default: '200'
        type: string
      timeout_per_iter_secs:
        description: 'Per-iteration timeout (seconds)'
        required: false
        default: '180'
        type: string

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Deep stress: N=200 on every (os, backend) we ship. Each iteration
  # is a full `zig build test` run with a fresh seed and a per-iteration
  # timeout. If any iteration hangs past the timeout, that entry fails
  # with a stack-trace sample logged.
  # ─────────────────────────────────────────────────────────────────────
  stress-deep:
    name: Stress N=${{ github.event.inputs.n_iters || '200' }} (${{ matrix.name }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x86_64-epoll,   build_args: "" }
          - { os: ubuntu-latest,    name: linux-x86_64-iouring, build_args: "-Dreactor=iouring" }
          - { os: ubuntu-22.04-arm, name: linux-arm64-epoll,    build_args: "" }
          - { os: ubuntu-22.04-arm, name: linux-arm64-iouring,  build_args: "-Dreactor=iouring" }
          - { os: macos-latest,     name: macos-arm64-kqueue,   build_args: "" }
          # macos-x86_64 dropped — Apple Silicon is the v1 macOS target.
          # See ci.yml for rationale.
          # Windows IOCP — uncomment once W1–W8 land.
          # - { os: windows-latest, name: windows-x86_64-iocp,  build_args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System info
        shell: bash
        run: |
          uname -a
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Kernel: $(uname -r)"
          fi
      - name: Stress run
        shell: bash
        run: |
          N="${{ github.event.inputs.n_iters || '500' }}" \
          TIMEOUT_SECS="${{ github.event.inputs.timeout_per_iter_secs || '180' }}" \
          scripts/stress_test.sh ${{ matrix.build_args }}
      - name: Upload failed-iteration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs-${{ matrix.name }}
          path: tmp/stress/
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Valgrind on Linux. Detects definite leaks the runtime's own
  # `pendingCount == 0` assert can't catch (e.g. heap leaks below
  # the reactor layer). Best-effort — Valgrind doesn't always play
  # nicely with Zig's debug allocator, so this is allowed to skip
  # when the test binary path can't be discovered.
  # ─────────────────────────────────────────────────────────────────────
  valgrind:
    name: Valgrind (linux-x86_64)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build test binary (Debug)
        run: zig build test -Doptimize=Debug
      - name: Run Valgrind
        shell: bash
        run: |
          set -e
          # Zig 0.16 stashes the test binary in .zig-cache/o/<hash>/test
          TEST_BIN=$(find .zig-cache -type f -executable -name "test" 2>/dev/null | head -1)
          if [ -z "$TEST_BIN" ]; then
            echo "::warning::Test binary not found — skipping Valgrind"
            exit 0
          fi
          echo "Running Valgrind on $TEST_BIN"
          valgrind --leak-check=full \
                   --show-leak-kinds=definite \
                   --error-exitcode=1 \
                   --track-origins=yes \
                   --gen-suppressions=all \
                   "$TEST_BIN" 2>&1 | tee valgrind.log
          if grep -qE "definitely lost: [^0]" valgrind.log; then
            echo "::error::Definite memory leaks detected"
            exit 1
          fi
          echo "No definite leaks"

  # ─────────────────────────────────────────────────────────────────────
  # Cross-architecture consistency: same suite must pass on x86_64 AND
  # arm64. If only one fails, that's strong evidence of a memory-ordering
  # bug specific to the failing architecture's relaxed memory model.
  # ─────────────────────────────────────────────────────────────────────
  cross-arch:
    name: Cross-arch consistency
    needs: [stress-deep]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        run: |
          # GitHub doesn't expose individual matrix outcomes, but
          # `stress-deep.result` is `success` only when ALL matrix
          # entries succeed. So `success` here means x86 and arm
          # both passed.
          got="${{ needs.stress-deep.result }}"
          if [[ "$got" == "success" ]]; then
            echo "Cross-arch consistency: PASS (all matrix entries green)"
            exit 0
          fi
          echo "::warning::Cross-arch divergence — at least one (os, arch) failed"
          echo "Inspect the matrix breakdown to identify which architecture(s)"
          exit 1

  # ─────────────────────────────────────────────────────────────────────
  # Aggregated summary — single status line per nightly run.
  # ─────────────────────────────────────────────────────────────────────
  nightly-summary:
    name: Nightly Summary
    needs: [stress-deep, valgrind, cross-arch]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        run: |
          echo "## Nightly Test Results"
          echo ""
          echo "| Suite | Result |"
          echo "|---|---|"
          echo "| Stress (N=500, 6 entries) | ${{ needs.stress-deep.result }} |"
          echo "| Valgrind | ${{ needs.valgrind.result }} |"
          echo "| Cross-arch | ${{ needs.cross-arch.result }} |"

          fail=0
          if [[ "${{ needs.stress-deep.result }}" != "success" ]]; then fail=1; fi
          if [[ "${{ needs.valgrind.result }}" != "success" ]]; then fail=1; fi
          if [[ "${{ needs.cross-arch.result }}" != "success" ]]; then fail=1; fi
          [[ $fail -eq 0 ]] || exit 1
