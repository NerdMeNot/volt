name: Cross-platform probe (temp)

# Temporary workflow to validate the L1–L5 cross-platform runtime
# work against real GitHub-hosted runners. The regular CI is paused
# while this runs — see `ci.yml`'s commented-out triggers.
#
# What we're checking, per platform:
#   1. `zig build`            — module + bench targets compile.
#   2. `zig build test`       — unit tests run and pass.
#   3. `zig build bench-yield`— a real binary runs (smoke).
#
# Volt's ctx switch is ARM64-only today, so every runner is an
# ARM64 host:
#   - macOS arm64       → `macos-latest`        (M1+ default since macos-14)
#   - Linux arm64       → `ubuntu-24.04-arm`    (GitHub-hosted ARM64 free since 2024)
#   - Windows arm64     → `windows-11-arm`      (newer; may fail to schedule)
#
# Delete this file once the multi-platform story has stabilised
# and `ci.yml` has absorbed whichever jobs we want long-term.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Force bash on every platform. Default Windows shell is `pwsh`,
    # which swallowed the `zig build` exit code on the first probe
    # round (step exited code 1 in 0.4 s with zero output). Git Bash
    # is preinstalled on Windows runners and matches the Darwin/Linux
    # invocation exactly. Set at job level so every step inherits.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: zig version
        run: zig version

      - name: zig fmt --check
        run: zig fmt --check src/ bench/ build.zig

      - name: zig build
        run: zig build

      # Test runs are split per test-name prefix to bisect a hang.
      # Round 2 of this probe surfaced `zig build test` hanging
      # silently on every POSIX runner — same shape as the pre-
      # existing macos-latest issue from f6ffea2. Without
      # bisection we burn 20 min per round; with these per-family
      # steps (180s timeout each), one round identifies the
      # offending test prefix.
      #
      # `timeout 180s` ensures a stuck test family doesn't block
      # subsequent ones. `continue-on-error: true` lets every step
      # run regardless of upstream failures so we get full coverage
      # per probe. Each step uses `zig test src/lib.zig -lc` —
      # bypasses build.zig's run-step so the timeout binds the
      # actual test process.
      - name: test — runtime + scheduler + reactor (excludes channels)
        continue-on-error: true
        run: |
          timeout 180s zig test src/lib.zig -lc \
            --test-filter "runtime" \
            --test-filter "Cancel" \
            --test-filter "Mutex" \
            --test-filter "Notify" \
            --test-filter "Semaphore" \
            --test-filter "scope" \
            --test-filter "sleep" \
            --test-filter "parking lot" \
            --test-filter "register" \
            --test-filter "P." \
            --test-filter "Arena" \
            --test-filter "WorkStealQueue" \
            --test-filter "TcpListener" \
            --test-filter "TCP echo"

      - name: test — spsc / mpmc (existing channels)
        continue-on-error: true
        run: |
          timeout 180s zig test src/lib.zig -lc \
            --test-filter "spsc" \
            --test-filter "mpmc"

      - name: test — oneshot (new in 2026-05-16)
        continue-on-error: true
        run: timeout 180s zig test src/lib.zig -lc --test-filter "oneshot"

      - name: test — watch (new in 2026-05-16; suspect)
        continue-on-error: true
        run: timeout 180s zig test src/lib.zig -lc --test-filter "watch"

      - name: test — broadcast (new in 2026-05-16; suspect)
        continue-on-error: true
        run: timeout 180s zig test src/lib.zig -lc --test-filter "broadcast"

      # Fallback: run anything we missed above. Catches tests with
      # name prefixes we forgot. Last so it doesn't block specific
      # diagnoses.
      - name: test — full suite (catch-all, may hang)
        continue-on-error: true
        run: timeout 300s zig build test

      # One bench in ReleaseFast — confirms a real binary spins up
      # the runtime, runs through the dispatch loop, and prints
      # numbers. Not a perf gate; just a smoke check.
      - name: zig build bench-yield (smoke)
        continue-on-error: true
        run: zig build bench-yield -Doptimize=ReleaseFast
