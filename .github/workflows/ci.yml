name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.15.2"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Quick Check - Formatting (fails fast)
  # ═══════════════════════════════════════════════════════════════════════════

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src/ tests/ bench/

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit Tests - All Platforms
  # ═══════════════════════════════════════════════════════════════════════════

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: System info
        shell: bash
        run: |
          echo "Platform: ${{ matrix.name }}"
          echo "Runner: ${{ matrix.os }}"
          uname -a || ver

      - name: Run unit tests
        run: zig build test

  # ═══════════════════════════════════════════════════════════════════════════
  # Extended Tests - Concurrency + Stress + Robustness (single job per platform)
  # Memory ordering bugs manifest differently on ARM vs x86
  # ═══════════════════════════════════════════════════════════════════════════

  extended-tests:
    name: Extended (${{ matrix.name }})
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run concurrency tests
        run: zig build test-concurrency

      - name: Run stress tests
        run: zig build test-stress

      - name: Run robustness tests
        run: zig build test-robustness

  # ═══════════════════════════════════════════════════════════════════════════
  # Release Build Verification
  # ═══════════════════════════════════════════════════════════════════════════

  release-build:
    name: Release (${{ matrix.name }})
    needs: extended-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build release
        run: zig build -Doptimize=ReleaseFast

      - name: Test in release mode
        run: zig build test -Doptimize=ReleaseFast

  # ═══════════════════════════════════════════════════════════════════════════
  # Benchmarks (build only - Linux/macOS, no Windows -- needs Rust for Tokio)
  # ═══════════════════════════════════════════════════════════════════════════

  benchmarks:
    name: Benchmarks (${{ matrix.name }})
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build benchmarks
        run: zig build bench

  # ═══════════════════════════════════════════════════════════════════════════
  # CI Success Gate
  # ═══════════════════════════════════════════════════════════════════════════

  ci-success:
    name: CI Success
    needs:
      - unit-tests
      - extended-tests
      - release-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Extended tests: ${{ needs.extended-tests.result }}"
          echo "Release build: ${{ needs.release-build.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.extended-tests.result }}" != "success" ]]; then
            echo "Extended tests failed"
            exit 1
          fi
          if [[ "${{ needs.release-build.result }}" != "success" ]]; then
            echo "Release build failed"
            exit 1
          fi

          echo "All CI checks passed!"
