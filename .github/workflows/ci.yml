name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

# ─────────────────────────────────────────────────────────────────────
# CI structure
#
# Volt's supported platforms are {Linux, macOS} × {arm64, x86_64}:
#   * macOS arm64   (kqueue + Apple AAPCS64)         → macos-latest
#   * macOS x86_64  (kqueue + SysV x86-64)           → cross-compile only
#                    (GitHub has no Intel-mac runner)
#   * Linux arm64   (epoll/io_uring + AAPCS64)       → ubuntu-24.04-arm
#   * Linux x86_64  (epoll/io_uring + SysV x86-64)   → ubuntu-latest
#
# Windows was dropped from scope on 2026-06-16 (focus on Linux + macOS;
# revisit later). The IOCP reactor + Win64 ctx switch remain in-tree but
# dormant — unbuilt, untested, unsupported. See issue #6.
#
# Jobs:
# 1. format        — `zig fmt --check` on src/ + bench/ + build.zig
# 2. cross-compile — every target's lib parses + type-checks
#                    (catches accidental platform-isms in portable
#                    code).
# 3. test          — full unit test suite, native, matrix of
#                    {macos arm64, linux arm64, linux x86_64}
# 4. bench-smoke   — one bench builds + runs, native macOS arm64.
#                    Cheap early signal that the runtime survives a
#                    real workload — not a perf gate.
# 5. ci-success    — single boolean gate
# ─────────────────────────────────────────────────────────────────────

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check src/ bench/ build.zig

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-gnu
          - x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build-lib src/lib.zig -target ${{ matrix.target }} -lc -fno-emit-bin

  test:
    name: Test (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    # Bumped from 15 to 30 to disambiguate "slow" from "hung" on
    # the L7 investigation. CI runners (2-4 vCPU) are 3-5x slower
    # than dev hardware (14+ core M-series); the bisected probe
    # rounds got individual filter steps through in <180s, so the
    # full suite SHOULD fit in 30 min if it isn't actually hung.
    timeout-minutes: 30
    # Pin bash explicitly so the `case` step below is portable across
    # macOS + Linux runners.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest       # arm64 since macos-14
          - ubuntu-24.04-arm   # GitHub-hosted ARM64 Linux (free since 2024)
          - ubuntu-latest      # x86_64 Linux — exercises SysV x86-64 ctx switch
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Use `zig test` directly instead of `zig build test`. The
      # build-runner protocol (`--listen=-`) buffers test output
      # so a hung test produces zero visible progress in CI logs —
      # impossible to tell "hung" from "still running" from
      # observable behaviour. Direct invocation streams per-test
      # progress to stderr in real time.
      #
      # x86_64 needs the per-OS ctx-switch `.S` file linked too;
      # build.zig handles it normally but bypassing it via direct
      # `zig test` means we have to plumb the asm in by hand here.
      # ARM64 uses inline asm in `context_arm64.zig` — no extra
      # file needed.
      - name: Run tests
        run: |
          args="src/lib.zig -lc"
          case "${{ matrix.os }}" in
            ubuntu-latest)  args="$args src/context_x86_64_sysv.S" ;;
          esac
          zig test $args

  bench-smoke:
    name: Bench smoke (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          # macOS arm64: kqueue reactor.
          - macos-latest
          # Linux x86_64: epoll/io_uring path (Runtime.Config.io_backend
          # = .auto picks io_uring when available, falls back to epoll).
          # Validating the runtime survives a real bench on each
          # Linux backend is the prerequisite for issue #3 (file
          # io_uring) + issue #7 structural work.
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Smoke-run a representative slice of benches. Validates:
      #   - bench-yield: ctx switch + dispatch end-to-end
      #   - bench-spsc:  SPSC channel + parking-lot
      #   - bench-rss:   stack pool + per-platform mmap
      #   - bench-tcp-echo: full reactor I/O path
      #   - bench-mutex: contention + cross-CPU cache traffic
      # If any bench panics / segfaults on a target platform, this
      # job catches it — the existing test job sometimes passes when
      # the runtime is structurally broken because tests don't
      # exercise full multi-worker load.
      - name: Bench smoke
        run: |
          zig build bench-yield bench-spsc bench-rss bench-mutex -Doptimize=ReleaseFast
          zig build bench-tcp-echo -Doptimize=ReleaseFast

  ci-success:
    name: CI Success
    needs: [format, cross-compile, test, bench-smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          fail=0
          for r in format cross-compile test bench-smoke; do
            case "$r" in
              format)        got="${{ needs.format.result }}" ;;
              cross-compile) got="${{ needs.cross-compile.result }}" ;;
              test)          got="${{ needs.test.result }}" ;;
              bench-smoke)   got="${{ needs.bench-smoke.result }}" ;;
            esac
            if [[ "$got" != "success" ]]; then
              echo "::error::$r → $got"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All CI checks passed."
